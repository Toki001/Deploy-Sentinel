name: DeploySentinel Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Immutable GHCR Container Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
            image: deploysentinel-web
          - service: api
            dockerfile: services/api/Dockerfile
            image: deploysentinel-api
          - service: processor
            dockerfile: services/processor/Dockerfile
            image: deploysentinel-processor
          - service: investigator
            dockerfile: services/investigator/Dockerfile
            image: deploysentinel-investigator

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Determine Release Tag
        id: meta
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Check GHCR Publish Eligibility
        id: auth-check
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "can_publish=true" >> $GITHUB_OUTPUT
          else
            echo "can_publish=false" >> $GITHUB_OUTPUT
            echo "::warning ::GITHUB_TOKEN missing or unauthorized; running dry-run build verification only."
          fi

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.auth-check.outputs.can_publish == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image (${{ matrix.service }})
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.auth-check.outputs.can_publish == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.title=DeploySentinel ${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
