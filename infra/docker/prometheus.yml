global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts/*.yaml"

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "deploysentinel-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000", "host.docker.internal:4000"]

  - job_name: "deploysentinel-processor"
    metrics_path: /metrics
    static_configs:
      - targets: ["processor:4001", "host.docker.internal:4001"]

  - job_name: "deploysentinel-investigator"
    metrics_path: /metrics
    static_configs:
      - targets: ["investigator:4002", "host.docker.internal:4002"]
