apiVersion: 1

groups:
  - name: deploysentinel-alerts
    rules:
      - alert: HighIngress429Backpressure
        expr: sum(rate(deploysentinel_ingress_backpressure_total[1m])) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High ingress backpressure detected"
          description: "API is rejecting more than 10 requests/sec with HTTP 429 backpressure."

      - alert: ConsumerLagBreach
        expr: sum(deploysentinel_consumer_lag) > 500
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag exceeding threshold"
          description: "Correlation worker consumer lag has remained above 500 for over 3 minutes."

      - alert: DeadLetterQueueSpike
        expr: sum(rate(deploysentinel_dlq_events_total[1m])) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spike in DLQ events"
          description: "Poison or schema-violating events arriving in Dead-Letter Queue."
